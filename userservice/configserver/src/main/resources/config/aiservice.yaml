spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
data:
  mongodb:
    uri: mongodb://localhost:27017/fitnessrecomendations
    database: fitnessrecomendations

server :
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

rabbitmq :
  exchange :
    name : fitness.exchange
  queue :
    name : activity.queue
  routing :
    key: activity.tracking

gemini :
  api :
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
    key: ${GEMINI_API_KEY}