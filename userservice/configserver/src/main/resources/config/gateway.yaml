spring:
  application:
   name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: user-service
            uri: lb://USER-SERVICE
            predicates:
              - Path=/api/users/**
          - id: activity-service
            uri: lb://ACTIVITY-SERVICE
            predicates:
              - Path=/api/activities/**
          - id: activity-service
            uri: lb://AISERVICE
            predicates:
              - Path=/api/recommendations/**
server:
  port : 8080

eureka :
  client:
    service-url :
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: false